name: Automated Database Backup & Disaster Recovery Drill

on:
  schedule:
    # Ejecución automática diaria a las 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup-and-verify:
    name: Backup Drill & Parity Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Execute Backup & Restoration Drill
        run: |
          python -m backend.backup --drill

      - name: Run Dedicated Backup Test Suite
        run: |
          pytest -v backend/tests/test_audit_p3.py -k Point20
