services:
  # ============================================================================
  # 🌊 AquaPulse Backend - FastAPI Predictive Service
  # ============================================================================
  - type: web
    name: aquapulse-backend
    env: python
    region: oregon # O la región que utilices
    plan: free
    branch: main
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    # Aquí unimos la migración de Alembic con el comando de inicio de Uvicorn usando '&&'
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false # O enlazado a tu base de datos PostgreSQL en Render
      - key: ALLOWED_ORIGINS
        value: "*" # Configura aquí la URL de tu frontend en Vercel (ej: https://aquapulse.vercel.app)
      - key: GEMINI_API_KEY
        sync: false # Pega aquí tu API Key de Gemini en el panel de Render
      - key: VISION_MODEL
        value: gemini-3.1-flash-lite
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: JWT_SECRET
        generateValue: true

databases:
  # ============================================================================
  # 🐘 PostgreSQL Database en Render (Opcional si sync: false conecta base externa)
  # ============================================================================
  - name: aquapulse-postgres
    databaseName: aquatracker
    user: aquapulse_admin
    region: oregon
    plan: free
    postgresMajorVersion: 16
